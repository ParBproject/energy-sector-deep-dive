[project]
name = "energy-sector-deep-dive"
version = "0.1.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E401", "E402", "E501", "F401", "I001"]
"scripts/make_notebooks.py" = ["E501"]

[tool.ruff.format]
exclude = ["notebooks/*"]
